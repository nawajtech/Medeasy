name: Sync Staging to Main

on:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch All Branches
        run: git fetch origin

      - name: Checkout Main
        run: git checkout -B main origin/main

      - name: Save Main Workflow Files
        run: |
          mkdir -p /tmp/main-workflows
          cp -a .github/workflows/. /tmp/main-workflows/

      - name: Merge Staging Without Workflow Conflicts
        run: |
          git merge -s ours --no-commit --no-ff origin/staging
          git read-tree -m -u HEAD origin/staging
          git checkout HEAD -- .github/workflows/
          git add -A
          git commit -m "Sync staging into main while preserving main workflows"

      - name: Restore Main Workflow Files
        run: |
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/main-workflows/. .github/workflows/
          git add -A .github/workflows/
          git commit -m "Preserve main-specific workflows" || true

      - name: Push Main
        run: git push origin main
