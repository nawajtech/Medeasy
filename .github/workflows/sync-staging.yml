name: Sync Staging to Main and Deploy Production

on:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch All Branches
        run: git fetch origin

      - name: Checkout Main
        run: git checkout -B main origin/main

      - name: Save Main Workflow Files
        run: |
          mkdir -p /tmp/main-workflows
          cp -a .github/workflows/. /tmp/main-workflows/

      - name: Merge Staging Without Workflow Conflicts
        run: |
          git merge -s ours --no-commit --no-ff origin/staging
          git read-tree -m -u HEAD origin/staging
          git checkout HEAD -- .github/workflows/
          git add -A
          git commit -m "Sync staging into main while preserving main workflows"

      - name: Restore Main Workflow Files
        run: |
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/main-workflows/. .github/workflows/
          git add -A .github/workflows/
          git commit -m "Preserve main-specific workflows" || true

      - name: Push Main
        run: git push origin main

      - name: Deploy to Production EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }} # e.g. ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/your-app-directory # Replace with your actual project path
            git fetch origin main
            git checkout main
            git pull origin main

            # Backend: Laravel Updates
            cd backend
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Frontend: React / Vite Build
            cd ../frontend
            npm ci
            npm run build

            # Refresh Web Server / FastCGI
            sudo systemctl reload nginx
            sudo systemctl reload php8.2-fpm # Change to your installed PHP version (e.g., php8.1-fpm or php8.3-fpm)
