name: Deploy Production

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Do NOT include an 'environment:' line here

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Remote Branches
        run: git fetch origin

      - name: Checkout Main
        run: git checkout -B main origin/main

      - name: Merge Staging into Main
        run: |
          git merge origin/staging --no-commit --no-ff || true
          git checkout HEAD -- .github/workflows/
          git add -A
          git commit -m "Auto-merge staging to main [skip ci]" || true
          git push origin main

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo "================================"
            echo "Starting Deployment"
            echo "================================"

            cd /var/www/Medeasy
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main
            git clean -fd

            # Laravel Backend
            cd backand
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            sudo find storage -type f -exec chmod 664 {} \;
            sudo find bootstrap/cache -type f -exec chmod 664 {} \;

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            php artisan storage:link || true
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo chown -R www-data:www-data storage bootstrap/cache

            # React Frontend
            cd ../frontend
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build

            # Reload Web Server Services
            sudo systemctl reload php8.5-fpm || sudo systemctl reload php8.2-fpm
            sudo systemctl reload nginx

            echo "================================"
            echo "Deployment Completed Successfully"
            echo "================================"
