name: Deploy Production

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # REPLACE 'production' WITH YOUR EXACT ENVIRONMENT NAME FROM STEP 1
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Remote Branches
        run: git fetch origin

      - name: Checkout Main Branch
        run: git checkout -B main origin/main

      - name: Auto-Merge Staging to Main
        run: |
          git merge origin/staging --no-commit --no-ff || true
          git checkout HEAD -- .github/workflows/
          git add -A
          git commit -m "Auto-merge staging to main [skip ci]" || true
          git push origin main

      - name: Verify Secret Availability
        env:
          CHECK_HOST: ${{ secrets.EC2_HOST }}
          CHECK_USER: ${{ secrets.EC2_USERNAME }}
          CHECK_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "=========================================="
          echo "Checking Secret Availability..."
          echo "=========================================="
          
          if [ -z "$CHECK_HOST" ]; then
            echo "::error::EC2_HOST is EMPTY! Check that environment name matches exactly."
            exit 1
          else
            echo "✓ EC2_HOST is present (length: ${#CHECK_HOST} chars)"
          fi

          if [ -z "$CHECK_USER" ]; then
            echo "::error::EC2_USERNAME is EMPTY!"
            exit 1
          else
            echo "✓ EC2_USERNAME is present (${CHECK_USER})"
          fi

          if [ -z "$CHECK_KEY" ]; then
            echo "::error::EC2_SSH_KEY is EMPTY!"
            exit 1
          else
            echo "✓ EC2_SSH_KEY is present"
          fi

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo "=========================================="
            echo "Connected to AWS EC2. Starting deploy..."
            echo "=========================================="

            whoami
            pwd

            cd /var/www/Medeasy

            echo "Pulling latest code on main..."
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main
            git clean -fd

            git status
            git log --oneline -1

            cd backand

            echo "Configuring permissions..."
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            sudo find storage -type f -exec chmod 664 {} \;
            sudo find bootstrap/cache -type f -exec chmod 664 {} \;

            echo "Installing composer dependencies..."
            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction

            php artisan storage:link || true
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo chown -R www-data:www-data storage bootstrap/cache

            cd ../frontend

            echo "Installing npm dependencies & building..."
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build

            echo "Reloading Nginx and PHP-FPM..."
            sudo systemctl reload php8.5-fpm || sudo systemctl reload php8.2-fpm || true
            sudo systemctl reload nginx

            echo "=========================================="
            echo "Deployment Completed Successfully!"
            echo "=========================================="
